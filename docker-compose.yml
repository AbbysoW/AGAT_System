

services:

  core_service:
    build: core_service\

    container_name: core_service

    ports:
      - "8000:8000"
    volumes:
      - /mnt/windows/Programs/AGAT_System/Core/Filter/STT/Importance/Models:/app/modules/filter/stt_filter/imp_model/models/
      - /mnt/windows/Programs/AGAT_System/Core/Filter/STT/ShouldShutUp/Models:/app/modules/filter/stt_filter/should_shut_up/models/
      - /mnt/windows/Programs/AGAT_System/Core/logs:/app/logger/logs
      - /mnt/windows/Programs/AGAT_System/Core/data:/app/data

  chat_service:
    build: chat_service\

    container_name: chat_service

    ports:
      - "8001:8001"
    volumes:
      - /mnt/windows/Programs/AGAT_System/Chat/Models:/app/side_llm_pipeline/models
      - /mnt/windows/Programs/AGAT_System/Chat/logs:/app/logger/logs

  searching_service:
    image: neo4j:5.26

    container_name: searching_service

    environment:
     - PYTHONDONTWRITEBYTECODE=1
     - NEO4J_AUTH=neo4j/1234

    ports:
      - "8002:8002"
      - "7474:7474"  # веб интерфейс
      - "7687:7687"  # bolt протокол (для подключения из кода)
    volumes:
      - /mnt/windows/Programs/AGAT_System/Search/data:/data
      - /mnt/windows/Programs/AGAT_System/Search/logs:/logs